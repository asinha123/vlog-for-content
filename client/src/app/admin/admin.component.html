<div>
  <h2>Admin - Upload Video</h2>
  <div>
    <label>Title<br /><input [(ngModel)]="title" /></label>
  </div>
  <div>
    <label>Description<br /><textarea [(ngModel)]="description"></textarea></label>
  </div>
  <div>
    <input type="file" accept="video/*" (change)="onFile($event)" />
  </div>
  <div style="margin-top:8px">
    <button (click)="upload()">Upload</button>
  </div>
</div>
